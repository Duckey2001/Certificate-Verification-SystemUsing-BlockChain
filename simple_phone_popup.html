<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOL Certificate Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* M-Pesa Popup Styles */
        .mpesa-popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .mpesa-popup {
            background: #00875a;
            color: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 350px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .mpesa-popup h3 {
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .mpesa-popup p {
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
        }

        .form-group input:focus {
            outline: none;
            background: white;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
        }

        .mpesa-popup button {
            background: white;
            color: #00875a;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
        }

        .mpesa-popup button:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
        }

        .mpesa-popup button:disabled {
            background: #ccc;
            color: #666;
            cursor: not-allowed;
            transform: none;
        }

        .success-message {
            background: #e8f5e8;
            color: #2e7d32;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            max-width: 350px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .success-message h3 {
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- M-Pesa Phone Number Popup -->
    <div class="mpesa-popup-overlay" id="phonePopup">
        <div class="mpesa-popup">
            <h3>🏫 ECOL Verification</h3>
            <p>Enter your M-Pesa number to receive verification PIN via SMS</p>
            
            <div class="form-group">
                <input type="tel" id="phoneNumber" placeholder="+26657620256" maxlength="12" value="+26657620256">
            </div>
            
            <button onclick="submitPhoneNumber()" id="submitBtn">📱 Send SMS</button>
            <button onclick="cancelPayment()">Cancel</button>
        </div>
    </div>

    <!-- Success Message -->
    <div class="success-message hidden" id="successMessage">
        <h3>✅ SMS Sent!</h3>
        <p>Check your phone for the verification SMS with PIN</p>
        <p><strong>Reply to the SMS with the PIN to complete payment</strong></p>
        <p style="font-size: 12px; margin-top: 15px;">Certificate: CERT-2024-001<br>
        Amount: 50.00 LSL<br>
        University: National University of Lesotho</p>
    </div>

    <script>
        const BASE_URL = 'http://localhost:5000';

        async function submitPhoneNumber() {
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            
            if (!phoneNumber) {
                alert('Please enter your phone number');
                return;
            }

            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Sending...';

            try {
                const response = await fetch(`${BASE_URL}/api/payment/initiate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        phone_number: phoneNumber,
                        certificate_ref: 'CERT-2024-001',
                        university_name: 'National University of Lesotho',
                        amount: 5000, // 50.00 LSL
                        university_code: 'UNI001'
                    })
                });

                const result = await response.json();

                if (result.status === 'pending') {
                    // Hide popup, show success message
                    document.getElementById('phonePopup').classList.add('hidden');
                    document.getElementById('successMessage').classList.remove('hidden');
                    
                    console.log('✅ SMS sent to:', phoneNumber);
                    console.log('Transaction ID:', result.transaction_id);
                } else {
                    alert('Failed to send SMS: ' + (result.error || 'Unknown error'));
                    submitBtn.disabled = false;
                    submitBtn.textContent = '📱 Send SMS';
                }
            } catch (error) {
                alert('Network error: ' + error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = '📱 Send SMS';
            }
        }

        function cancelPayment() {
            if (confirm('Cancel payment process?')) {
                window.close();
            }
        }

        // Auto-focus phone input
        document.getElementById('phoneNumber').focus();
        
        // Allow Enter key to submit
        document.getElementById('phoneNumber').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                submitPhoneNumber();
            }
        });
    </script>
</body>
</html>
