version: '3.8'

services:
  # Ordering Service
  orderer.certivert.com:
    container_name: orderer.certivert.com
    image: hyperledger/fabric-orderer:2.5.0
    environment:
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=file
      - ORDERER_GENERAL_BOOTSTRAPFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_KAFKA_TOPIC_REPLICATIONFACTOR=1
      - ORDERER_KAFKA_VERBOSE=true
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/orderer
    command: orderer
    volumes:
      - ./fabric/network/crypto-config/ordererOrganizations/certivert.com/orderers/orderer.certivert.com/msp:/var/hyperledger/orderer/msp
      - ./fabric/network/crypto-config/ordererOrganizations/certivert.com/orderers/orderer.certivert.com/tls:/var/hyperledger/orderer/tls
      - ./fabric/network/channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
    ports:
      - 7050:7050
    networks:
      - certivert_network

  # Peer for Org1 (Issuer)
  peer0.org1.certivert.com:
    container_name: peer0.org1.certivert.com
    image: hyperledger/fabric-peer:2.5.0
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=certivert_network
      - CORE_PEER_ID=peer0.org1.certivert.com
      - CORE_PEER_ADDRESS=peer0.org1.certivert.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.certivert.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.certivert.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.certivert.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_OPERATIONS_LISTENADDRESS=peer0.org1.certivert.com:9443
    volumes:
      - /var/run/:/host/var/run/
      - ./fabric/network/crypto-config/peerOrganizations/org1.certivert.com/peers/peer0.org1.certivert.com/msp:/etc/hyperledger/fabric/msp
      - ./fabric/network/crypto-config/peerOrganizations/org1.certivert.com/peers/peer0.org1.certivert.com/tls:/etc/hyperledger/fabric/tls
      - peer0.org1.certivert.com:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - 7051:7051
      - 7052:7052
      - 9443:9443
    depends_on:
      - orderer.certivert.com
    networks:
      - certivert_network

  # Peer for Org2 (Verifier)
  peer0.org2.certivert.com:
    container_name: peer0.org2.certivert.com
    image: hyperledger/fabric-peer:2.5.0
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=certivert_network
      - CORE_PEER_ID=peer0.org2.certivert.com
      - CORE_PEER_ADDRESS=peer0.org2.certivert.com:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org2.certivert.com:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org2.certivert.com:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org2.certivert.com:8051
      - CORE_PEER_LOCALMSPID=Org2MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_OPERATIONS_LISTENADDRESS=peer0.org2.certivert.com:9444
    volumes:
      - /var/run/:/host/var/run/
      - ./fabric/network/crypto-config/peerOrganizations/org2.certivert.com/peers/peer0.org2.certivert.com/msp:/etc/hyperledger/fabric/msp
      - ./fabric/network/crypto-config/peerOrganizations/org2.certivert.com/peers/peer0.org2.certivert.com/tls:/etc/hyperledger/fabric/tls
      - peer0.org2.certivert.com:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - 8051:8051
      - 8052:8052
      - 9444:9444
    depends_on:
      - orderer.certivert.com
    networks:
      - certivert_network

  # CLI Container for setup and chaincode operations
  cli:
    container_name: cli
    image: hyperledger/fabric-tools:2.5.0
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=cli
      - CORE_PEER_ADDRESS=peer0.org1.certivert.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_ROOTCERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/org1.certivert.com/peers/peer0.org1.certivert.com/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/org1.certivert.com/users/Admin@org1.certivert.com/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - /var/run/:/host/var/run/
      - ./fabric/network/crypto-config:/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/
      - ./fabric/network/channel-artifacts:/opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts
      - ../fabric/chaincode:/opt/gopath/src/github.com/hyperledger/fabric/chaincode
    depends_on:
      - orderer.certivert.com
      - peer0.org1.certivert.com
      - peer0.org2.certivert.com
    networks:
      - certivert_network

  # CouchDB for Org1 Peer
  couchdb0.org1.certivert.com:
    container_name: couchdb0.org1.certivert.com
    image: couchdb:3.1
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - 5984:5984
    networks:
      - certivert_network

  # CouchDB for Org2 Peer
  couchdb0.org2.certivert.com:
    container_name: couchdb0.org2.certivert.com
    image: couchdb:3.1
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - 6984:5984
    networks:
      - certivert_network

volumes:
  peer0.org1.certivert.com:
  peer0.org2.certivert.com:

networks:
  certivert_network:
    name: certivert_network
    driver: bridge
