version: '3.7'

services:
  # ---------------------------------------------------------------------------
  #   Certificate Authorities (CAs)
  # ---------------------------------------------------------------------------
  ca.orderer.example.com:
    image: hyperledger/fabric-ca:latest
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-orderer
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:17054
    ports:
      - "7054:7054"
      - "17054:17054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/fabric-ca/ordererOrg:/etc/hyperledger/fabric-ca-server
    container_name: ca_orderer
    networks:
      - lgcse

  ca.ecol.example.com:
    image: hyperledger/fabric-ca:latest
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-ecol
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=8054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:18054
    ports:
      - "8054:8054"
      - "18054:18054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/fabric-ca/ecolOrg:/etc/hyperledger/fabric-ca-server
    container_name: ca_ecol
    networks:
      - lgcse

  ca.limkokwing.example.com:
    image: hyperledger/fabric-ca:latest
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-limkokwing
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=9054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:19054
    ports:
      - "9054:9054"
      - "19054:19054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/fabric-ca/limkokwingOrg:/etc/hyperledger/fabric-ca-server
    container_name: ca_limkokwing
    networks:
      - lgcse

  ca.botho.example.com:
    image: hyperledger/fabric-ca:latest
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-botho
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=10054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:20054
    ports:
      - "10054:10054"
      - "20054:20054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/fabric-ca/bothoOrg:/etc/hyperledger/fabric-ca-server
    container_name: ca_botho
    networks:
      - lgcse

  ca.nul.example.com:
    image: hyperledger/fabric-ca:latest
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-nul
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=11054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:21054
    ports:
      - "11054:11054"
      - "21054:21054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/fabric-ca/nulOrg:/etc/hyperledger/fabric-ca-server
    container_name: ca_nul
    networks:
      - lgcse

  # ---------------------------------------------------------------------------
  #   Orderer
  # ---------------------------------------------------------------------------
  orderer.example.com:
    image: hyperledger/fabric-orderer:latest
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/etc/hyperledger/fabric/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/etc/hyperledger/fabric/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/etc/hyperledger/fabric/tls/ca.crt]
      - ORDERER_KAFKA_TOPIC_REPLICATIONFACTOR=1
      - ORDERER_KAFKA_VERBOSE=true
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/etc/hyperledger/fabric/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/etc/hyperledger/fabric/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/etc/hyperledger/fabric/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/etc/hyperledger/fabric/tls/server.key
      - ORDERER_ADMIN_TLS_CERTIFICATE=/etc/hyperledger/fabric/tls/server.crt
      - ORDERER_ADMIN_TLS_ROOTCAS=[/etc/hyperledger/fabric/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/etc/hyperledger/fabric/tls/ca.crt]
      - ORDERER_METRICS_PROVIDER=prometheus
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:9443
      - ORDERER_OPERATIONS_TLS_ENABLED=true
      - ORDERER_OPERATIONS_TLS_PRIVATEKEY=/etc/hyperledger/fabric/tls/server.key
      - ORDERER_OPERATIONS_TLS_CERTIFICATE=/etc/hyperledger/fabric/tls/server.crt
      - ORDERER_OPERATIONS_TLS_ROOTCAS=[/etc/hyperledger/fabric/tls/ca.crt]
      - ORDERER_OPERATIONS_TLS_CLIENTROOTCAS=[/etc/hyperledger/fabric/tls/ca.crt]
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/orderer
    command: orderer
    ports:
      - 7050:7050
      - 7053:7053
      - 9443:9443
    volumes:
      - ../organizations/ordererOrganizations/example.com/orderers/orderer.example.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls:/etc/hyperledger/fabric/tls
      - orderer.example.com:/etc/hyperledger/fabric/orderer.example.com
    container_name: orderer.example.com
    networks:
      - lgcse

  # ---------------------------------------------------------------------------
  #   Peers
  # ---------------------------------------------------------------------------
  peer0.ecol.example.com:
    image: hyperledger/fabric-peer:latest
    environment:
      - CORE_PEER_ID=peer0.ecol.example.com
      - CORE_PEER_ADDRESS=peer0.ecol.example.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.ecol.example.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.ecol.example.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.ecol.example.com:7051
      - CORE_PEER_LOCALMSPID=EcolOrgMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_MSP_CONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer0.ecol.example.com:9444
      - CORE_OPERATIONS_TLS_ENABLED=true
      - CORE_OPERATIONS_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_OPERATIONS_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_OPERATIONS_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_METRICS_PROVIDER=prometheus
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_CHAINCODE_LOGGING_LEVEL=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=lgcse
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CORE_LEDGER_STATE_COUCHDBCONFIG_MAXRETRIES=3
      - CORE_LEDGER_STATE_COUCHDBCONFIG_MAXRETRIES_ONSTARTUP=10
      - CORE_LEDGER_STATE_COUCHDBCONFIG_REQUEST_TIMEOUT=35s
      - CORE_LEDGER_STATE_COUCHDBCONFIG_INTERNAL_QUERY_LIMIT=1000
      - CORE_LEDGER_STATE_COUCHDBCONFIG_MAX_BATCH_UPDATE_SIZE=500
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - 7051:7051
      - 7052:7052
      - 9444:9444
    volumes:
      - ../organizations/peerOrganizations/ecol.example.com/peers/peer0.ecol.example.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/ecol.example.com/peers/peer0.ecol.example.com/tls:/etc/hyperledger/fabric/tls
      - peer0.ecol.example.com:/etc/hyperledger/fabric
      - /var/run/docker.sock:/host/var/run/docker.sock
    container_name: peer0.ecol.example.com
    networks:
      - lgcse
    depends_on:
      - couchdb0

  peer0.limkokwing.example.com:
    image: hyperledger/fabric-peer:latest
    environment:
      - CORE_PEER_ID=peer0.limkokwing.example.com
      - CORE_PEER_ADDRESS=peer0.limkokwing.example.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.limkokwing.example.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.limkokwing.example.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.limkokwing.example.com:9051
      - CORE_PEER_LOCALMSPID=LimkokwingOrgMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_MSP_CONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer0.limkokwing.example.com:9445
      - CORE_OPERATIONS_TLS_ENABLED=true
      - CORE_OPERATIONS_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_OPERATIONS_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_OPERATIONS_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_METRICS_PROVIDER=prometheus
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_CHAINCODE_LOGGING_LEVEL=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=lgcse
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb1:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - 9051:9051
      - 9052:9052
      - 9445:9445
    volumes:
      - ../organizations/peerOrganizations/limkokwing.example.com/peers/peer0.limkokwing.example.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/limkokwing.example.com/peers/peer0.limkokwing.example.com/tls:/etc/hyperledger/fabric/tls
      - peer0.limkokwing.example.com:/etc/hyperledger/fabric
      - /var/run/docker.sock:/host/var/run/docker.sock
    container_name: peer0.limkokwing.example.com
    networks:
      - lgcse
    depends_on:
      - couchdb1

  peer0.botho.example.com:
    image: hyperledger/fabric-peer:latest
    environment:
      - CORE_PEER_ID=peer0.botho.example.com
      - CORE_PEER_ADDRESS=peer0.botho.example.com:11051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:11051
      - CORE_PEER_CHAINCODEADDRESS=peer0.botho.example.com:11052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:11052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.botho.example.com:11051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.botho.example.com:11051
      - CORE_PEER_LOCALMSPID=BothoOrgMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_MSP_CONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer0.botho.example.com:9446
      - CORE_OPERATIONS_TLS_ENABLED=true
      - CORE_OPERATIONS_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_OPERATIONS_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_OPERATIONS_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_METRICS_PROVIDER=prometheus
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_CHAINCODE_LOGGING_LEVEL=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=lgcse
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb2:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - 11051:11051
      - 11052:11052
      - 9446:9446
    volumes:
      - ../organizations/peerOrganizations/botho.example.com/peers/peer0.botho.example.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/botho.example.com/peers/peer0.botho.example.com/tls:/etc/hyperledger/fabric/tls
      - peer0.botho.example.com:/etc/hyperledger/fabric
      - /var/run/docker.sock:/host/var/run/docker.sock
    container_name: peer0.botho.example.com
    networks:
      - lgcse
    depends_on:
      - couchdb2

  peer0.nul.example.com:
    image: hyperledger/fabric-peer:latest
    environment:
      - CORE_PEER_ID=peer0.nul.example.com
      - CORE_PEER_ADDRESS=peer0.nul.example.com:12051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:12051
      - CORE_PEER_CHAINCODEADDRESS=peer0.nul.example.com:12052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:12052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.nul.example.com:12051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.nul.example.com:12051
      - CORE_PEER_LOCALMSPID=NulOrgMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_MSP_CONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer0.nul.example.com:9447
      - CORE_OPERATIONS_TLS_ENABLED=true
      - CORE_OPERATIONS_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_OPERATIONS_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_OPERATIONS_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_METRICS_PROVIDER=prometheus
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_CHAINCODE_LOGGING_LEVEL=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=lgcse
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb3:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - 12051:12051
      - 12052:12052
      - 9447:9447
    volumes:
      - ../organizations/peerOrganizations/nul.example.com/peers/peer0.nul.example.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/nul.example.com/peers/peer0.nul.example.com/tls:/etc/hyperledger/fabric/tls
      - peer0.nul.example.com:/etc/hyperledger/fabric
      - /var/run/docker.sock:/host/var/run/docker.sock
    container_name: peer0.nul.example.com
    networks:
      - lgcse
    depends_on:
      - couchdb3

  # ---------------------------------------------------------------------------
  #   CouchDB instances for state database
  # ---------------------------------------------------------------------------
  couchdb0:
    image: couchdb:3.3.2
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - 5984:5984
    container_name: couchdb0
    networks:
      - lgcse

  couchdb1:
    image: couchdb:3.3.2
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - 6984:5984
    container_name: couchdb1
    networks:
      - lgcse

  couchdb2:
    image: couchdb:3.3.2
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - 7984:5984
    container_name: couchdb2
    networks:
      - lgcse

  couchdb3:
    image: couchdb:3.3.2
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - 8984:5984
    container_name: couchdb3
    networks:
      - lgcse

  # ---------------------------------------------------------------------------
  #   CLI tools for network management
  # ---------------------------------------------------------------------------
  cli:
    image: hyperledger/fabric-tools:latest
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_LOCALMSPID=EcolOrgMSP
      - CORE_PEER_TLS_ROOTCERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/ecol.example.com/peers/peer0.ecol.example.com/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/ecol.example.com/users/Admin@ecol.example.com/msp
      - CORE_PEER_ADDRESS=peer0.ecol.example.com:7051
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - ../organizations:/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations
      - ../scripts:/opt/gopath/src/github.com/hyperledger/fabric/peer/scripts/
      - ../config:/opt/gopath/src/github.com/hyperledger/fabric/peer/config/
      - /var/run/docker.sock:/host/var/run/docker.sock
    container_name: cli
    networks:
      - lgcse

  # ---------------------------------------------------------------------------
  #   Chaincode explorer (optional)
  # ---------------------------------------------------------------------------
  explorer:
    image: ghcr.io/hyperledger-labs/explorer:latest
    container_name: explorer
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgrespw
      - DATABASE_NAME=fabricexplorer
      - BLOCKCHAIN_NETWORK_TYPE=fabric
      - LOG_LEVEL_APP=info
      - LOG_LEVEL_DB=info
      - LOG_LEVEL_CONSOLE=debug
      - DISCOVERY_AS_localhost=true
      - SYNC_BLOCKS_LCINMILSEC=10000
    volumes:
      - ../explorer/config:/hyperledger/explorer/app/platform/fabric/blocks
      - ../explorer/crypto:/hyperledger/explorer/app/platform/fabric/crypto-config
      - /tmp/hyperledger:/tmp/hyperledger
    ports:
      - 8080:8080
    depends_on:
      - postgres
    networks:
      - lgcse

  postgres:
    image: postgres:14
    container_name: postgres
    environment:
      - DATABASE_DATABASE=fabricexplorer
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgrespw
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - lgcse

volumes:
  orderer.example.com:
  peer0.ecol.example.com:
  peer0.limkokwing.example.com:
  peer0.botho.example.com:
  peer0.nul.example.com:
  pgdata:

networks:
  lgcse:
    driver: bridge
