<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Pesa Payment Test</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-container { max-width: 600px; margin: 0 auto; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const PaymentModal = ({ isOpen, onClose, amount = 5.00, verificationId, onPaymentComplete }) => {
            const [phoneNumber, setPhoneNumber] = useState('');
            const [merchantNumber, setMerchantNumber] = useState('');
            const [paymentType, setPaymentType] = useState('phone'); // 'phone' or 'merchant'
            const [processing, setProcessing] = useState(false);
            const [error, setError] = useState('');
            const [success, setSuccess] = useState('');

            const formatLesothoPhone = (phone) => {
                let cleaned = phone.replace(/\D/g, '');
                
                if (cleaned.startsWith('266')) {
                    return '+' + cleaned;
                } else if (cleaned.startsWith('0')) {
                    return '+266' + cleaned.substring(1);
                } else if (cleaned.length === 8) {
                    return '+266' + cleaned;
                }
                return phone;
            };

            const handlePayment = async (e) => {
                e.preventDefault();
                
                if (paymentType === 'phone' && !phoneNumber) {
                    setError('Please enter your M-Pesa phone number');
                    return;
                }
                
                if (paymentType === 'merchant' && !merchantNumber) {
                    setError('Please enter merchant M-Pesa number');
                    return;
                }

                setProcessing(true);
                setError('');
                setSuccess('Simulating payment...');

                // Simulate payment processing
                setTimeout(() => {
                    setSuccess(`STK push sent to ${paymentType === 'phone' ? 'your phone' : 'merchant'}! Please check and enter your PIN.`);
                    setProcessing(false);
                    
                    setTimeout(() => {
                        onClose();
                    }, 2000);
                }, 2000);
            };

            if (!isOpen) return null;

            return React.createElement('div', {
                style: {
                    position: 'fixed',
                    top: 0,
                    left: 0,
                    right: 0,
                    bottom: 0,
                    backgroundColor: 'rgba(0,0,0,0.5)',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    zIndex: 1000
                }
            }, 
                React.createElement('div', {
                    style: {
                        backgroundColor: 'white',
                        padding: '20px',
                        borderRadius: '8px',
                        maxWidth: '400px',
                        width: '100%',
                        margin: '20px'
                    }
                }, [
                    React.createElement('h3', { key: 'title' }, 'M-Pesa Payment Test'),
                    
                    React.createElement('div', { key: 'amount', style: { backgroundColor: '#f0f8ff', padding: '10px', borderRadius: '4px', margin: '10px 0' } }, [
                        React.createElement('p', { key: 'label', style: { fontSize: '14px', color: '#0066cc' } }, 'Amount to Pay'),
                        React.createElement('p', { key: 'amount-text', style: { fontSize: '24px', fontWeight: 'bold', color: '#0066cc' } }, `M ${amount.toFixed(2)}`)
                    ]),
                    
                    React.createElement('div', { key: 'type-selection', style: { margin: '10px 0' } }, [
                        React.createElement('label', { key: 'label' }, 'Payment Type'),
                        React.createElement('div', { key: 'buttons', style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', margin: '10px 0' } }, [
                            React.createElement('button', {
                                key: 'phone-btn',
                                type: 'button',
                                onClick: () => setPaymentType('phone'),
                                style: {
                                    padding: '10px',
                                    border: paymentType === 'phone' ? '2px solid #0066cc' : '2px solid #ccc',
                                    backgroundColor: paymentType === 'phone' ? '#f0f8ff' : 'white',
                                    borderRadius: '4px'
                                }
                            }, '📱 Personal Phone'),
                            React.createElement('button', {
                                key: 'merchant-btn',
                                type: 'button',
                                onClick: () => setPaymentType('merchant'),
                                style: {
                                    padding: '10px',
                                    border: paymentType === 'merchant' ? '2px solid #0066cc' : '2px solid #ccc',
                                    backgroundColor: paymentType === 'merchant' ? '#f0f8ff' : 'white',
                                    borderRadius: '4px'
                                }
                            }, '🏪 Merchant Account')
                        ])
                    ]),
                    
                    paymentType === 'phone' ? React.createElement('div', { key: 'phone-input' }, [
                        React.createElement('label', { key: 'label' }, 'Your M-Pesa Phone Number (Lesotho)'),
                        React.createElement('input', {
                            key: 'input',
                            type: 'tel',
                            value: phoneNumber,
                            onChange: (e) => setPhoneNumber(e.target.value),
                            placeholder: '5XXX XXXX or +266 5XXX XXXX',
                            style: { width: '100%', padding: '8px', margin: '5px 0', border: '1px solid #ccc', borderRadius: '4px' },
                            disabled: processing
                        })
                    ]) : React.createElement('div', { key: 'merchant-input' }, [
                        React.createElement('label', { key: 'label' }, 'Merchant M-Pesa Number (Lesotho)'),
                        React.createElement('input', {
                            key: 'input',
                            type: 'tel',
                            value: merchantNumber,
                            onChange: (e) => setMerchantNumber(e.target.value),
                            placeholder: '5XXX XXXX or +266 5XXX XXXX',
                            style: { width: '100%', padding: '8px', margin: '5px 0', border: '1px solid #ccc', borderRadius: '4px' },
                            disabled: processing
                        })
                    ]),
                    
                    React.createElement('button', {
                        key: 'submit',
                        type: 'button',
                        onClick: handlePayment,
                        disabled: processing,
                        style: {
                            width: '100%',
                            padding: '12px',
                            backgroundColor: processing ? '#ccc' : '#28a745',
                            color: 'white',
                            border: 'none',
                            borderRadius: '4px',
                            fontSize: '16px',
                            cursor: processing ? 'not-allowed' : 'pointer'
                        }
                    }, processing ? 'Processing...' : `Pay with M-Pesa (${paymentType === 'phone' ? 'Personal' : 'Merchant'})`),
                    
                    error && React.createElement('div', { key: 'error', style: { color: 'red', margin: '10px 0', padding: '10px', backgroundColor: '#ffe6e6', borderRadius: '4px' } }, error),
                    success && React.createElement('div', { key: 'success', style: { color: 'green', margin: '10px 0', padding: '10px', backgroundColor: '#e6ffe6', borderRadius: '4px' } }, success)
                ].filter(Boolean))
            );
        };

        const App = () => {
            const [showModal, setShowModal] = useState(true);

            return React.createElement('div', { className: 'test-container' }, [
                React.createElement('h1', { key: 'title' }, 'M-Pesa Payment Enhancement Test'),
                React.createElement('p', { key: 'description' }, 'Testing the enhanced payment modal with phone and merchant options.'),
                React.createElement(PaymentModal, {
                    key: 'modal',
                    isOpen: showModal,
                    onClose: () => setShowModal(false),
                    amount: 5.00,
                    verificationId: 'TEST_123'
                })
            ]);
        };

        ReactDOM.render(React.createElement(App), document.getElementById('root'));
    </script>
</body>
</html>
